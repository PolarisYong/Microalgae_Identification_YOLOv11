# =============================================================================
# 微藻识别主流程 —— 批次配置
# =============================================================================
# 模板：复制为 configs/batch.yaml（文件名固定，不含日期）再改：
#
#     cp configs/batch.example.yaml configs/batch.yaml
#     python microalgae_identification/run_pipeline.py
#
# configs/batch.yaml 存在时会被自动加载，命令行无需 --config。
# 换批次只改里面的 batch.date（或用 --date 覆盖），文件名保持不变。
# 所有字段都可以被命令行参数覆盖，优先级：命令行 > 本文件 > 内置默认值。
# 内置默认值与重构前脚本内的硬编码逐字一致，因此**不配置也能得到原来的行为**。
# =============================================================================

batch:
  # 批次日期，同时用作默认目录名（photo_root 里的 {date} 占位符会被替换）
  date: "20261001"

  # 批次根目录：其下应含 CH1 … CH12（由第 1、2 步生成或手工放置）
  # 支持 {date} 占位符；Windows 写法示例："F:\\Microalgae_Photoes\\{date}"
  photo_root: "/home/smart/github_projects/photoes/{date}"

model:
  # 分割模型权重。留空则用仓库内 runs/segment/train4/weights/best.pt
  weights: ""

  # 腔室模板图，用于腔室掩膜过滤（直接影响识别结果，务必确认存在）。
  # 留空时按「识别脚本同目录 → 输入图所在目录」顺序查找 chamber_template.png。
  chamber_template: ""

detection:
  # 参与识别的流道（CH）编号。三种写法等价：
  #   channels: 12        → CH1 … CH12
  #   channels: [1, 2, 3]
  #   channels: "1-12"
  channels: 12

summary:
  # 培养时长（小时）。决定 03_可视化结果/<N>小时 目录名与产物文件名后缀
  valid_hours: "96"

  # 第 6 步（08_growth_curve_batch.py）使用的 流道 → 实验工况 映射。
  # 每批次都要重新填写；未列出的流道会被跳过并给出警告。
  # 留空则回退到重构前脚本内的默认映射（N287…N900）。
  channel_conditions:
    1: "N287"
    2: "N325"
    3: "N400"
    4: "N450"
    5: "N500"
    6: "N550"
    7: "N600"
    8: "N700"
    9: "N800"
    10: "N900"
    11: "N600"
    12: "N325"
